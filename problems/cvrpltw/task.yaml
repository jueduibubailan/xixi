task:
  name: CVRPLTW-on-POMO
  slug: cvrpltw
  description: "Solve the Capacitated Vehicle Routing Problem with **Length Limit**\
    \ and Time Windows\n(CVRPLTW) using POMO as the starting point. CVRPLTW is CVRPTW\
    \ plus one constraint per\nroute: the route's own length is bounded.\n\nA depot\
    \ and n customers are given. Every customer has a demand and a time window\n[ready,\
    \ due], and every customer takes a service time to serve.\n\nWrite a program that\
    \ finds a set of routes minimising the total travel distance\nsuch that, for every\
    \ route:\n  1. every customer is served exactly once across all routes;\n  2.\
    \ the total demand served on a route never exceeds the vehicle capacity;\n  3.\
    \ the arrival time at a customer is <= its due time. Arriving before the ready\
    \ time\n     is legal: the vehicle waits, and service starts at max(arrival, ready);\n\
    \  4. **the total length of the route (sum of Euclidean leg lengths, depot legs\n\
    \     included) is <= `max_route_length`, a per-instance limit**;\n  5. every\
    \ route starts and ends at the depot, and returning to the depot is always\n \
    \    allowed, because it is what makes a state with no legal customer escapable.\n\
    \nTravel time is the Euclidean distance between nodes (a vehicle speed of 1),\
    \ so\n\"arrival\" and \"distance\" are the same quantity up to the clock carried\
    \ along a route.\n\nThe length limit is the difference from CVRPTW: a route that\
    \ satisfies capacity and\nevery time window can still be rejected for running\
    \ too long, so the solver needs a\nfifth mask (or an equivalent length-aware decision)\
    \ and a way to return to the depot\nbefore the limit is exceeded. Each instance\
    \ carries its own `max_route_length`.\n\nThe starting point is POMO's CVRP solver\
    \ under `pomo/`. Adapt it: the variant lives in\nthe environment, and the code\
    \ must train from scratch and write its own checkpoint.\n"
  tips: '- The final score is the last AUGMENTATION SCORE line printed by test_n.

    - test_n uses random test data (test_data_load.enable = False).

    - Do not generate run.py; test_train.py is generated by the code_error agent.'
