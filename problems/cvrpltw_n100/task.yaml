task:
  name: CVRPLTW-n100-on-POMO (MVMoE-compatible)
  slug: cvrpltw_n100
  description: "Solve the Capacitated Vehicle Routing Problem with **Length Limit**\
    \ and Time Windows\n(CVRPLTW) at **n = 100**, on instances generated exactly the\
    \ way the MVMoE codebase\ngenerates them, using POMO as the starting point.\n\n\
    A depot and n = 100 customers are placed uniformly in the unit square. Every customer\
    \ has\na demand, a time window [ready, due], and a service time. Travel time equals\
    \ Euclidean\ndistance (vehicle speed = 1), so \"arrival\" and \"distance\" are\
    \ the same quantity up to\nthe clock carried along a route.\n\nWrite a program\
    \ that finds a set of routes minimising the total travel distance such\nthat,\
    \ for every route:\n  1. every customer is served exactly once across all routes;\n\
    \  2. the total demand served on a route never exceeds the vehicle capacity (50);\n\
    \  3. the arrival time at a customer is <= its due time. Arriving before the ready\
    \ time\n     is legal: the vehicle waits, and service starts at max(arrival, ready);\n\
    \  4. **the total Euclidean length of the route, depot legs included, is <=\n\
    \     `route_limit` (3.0)**;\n  5. every route starts and ends at the depot, and\
    \ returning to the depot is always\n     allowed, because it is what makes a state\
    \ with no legal customer escapable.\n\nThe depot's own window is [0, 3.0]: a vehicle\
    \ that cannot return by 3.0 has failed,\nwhich is the same thing as exceeding\
    \ the route limit here, because speed is 1.\n\nThe starting point is POMO's CVRP\
    \ solver under `pomo/`. Adapt it: the variant lives in\nthe environment, and the\
    \ code must train from scratch and write its own checkpoint.\n"
  tips: '- The final score is the last AUGMENTATION SCORE line printed by test_n.

    - test_n uses random test data (test_data_load.enable = False).

    - Do not generate run.py; test_train.py is generated by the code_error agent.'
