# A problem bundle for CVRPLTW at n = 100, with **MVMoE-compatible instances**.
#
# Why a separate bundle instead of the existing `problems/cvrpltw/`: that one builds its
# instances from a canonical schedule (windows widened by a slack factor, per-instance
# length limit derived from the schedule). MVMoE builds them completely differently --
# constant route limit 3.0, constant service time 0.2, depot window [0, 3], and windows from
# the "Learning to Delegate" construction. The two distributions are not comparable, so a
# comparison against MVMoE has to use MVMoE's numbers. Mixing them would silently change the
# meaning of an existing problem.
#
# `vrpar start problems/cvrpltw_n100/task.yaml` runs this problem against itself.

task:
  name: "CVRPLTW-n100-on-POMO (MVMoE-compatible)"
  slug: "cvrpltw_n100"
  description: |
    Solve the Capacitated Vehicle Routing Problem with **Length Limit** and Time Windows
    (CVRPLTW) at **n = 100**, on instances generated exactly the way the MVMoE codebase
    generates them, using POMO as the starting point.

    A depot and n = 100 customers are placed uniformly in the unit square. Every customer has
    a demand, a time window [ready, due], and a service time. Travel time equals Euclidean
    distance (vehicle speed = 1), so "arrival" and "distance" are the same quantity up to
    the clock carried along a route.

    Write a program that finds a set of routes minimising the total travel distance such
    that, for every route:
      1. every customer is served exactly once across all routes;
      2. the total demand served on a route never exceeds the vehicle capacity (50);
      3. the arrival time at a customer is <= its due time. Arriving before the ready time
         is legal: the vehicle waits, and service starts at max(arrival, ready);
      4. **the total Euclidean length of the route, depot legs included, is <=
         `route_limit` (3.0)**;
      5. every route starts and ends at the depot, and returning to the depot is always
         allowed, because it is what makes a state with no legal customer escapable.

    The depot's own window is [0, 3.0]: a vehicle that cannot return by 3.0 has failed,
    which is the same thing as exceeding the route limit here, because speed is 1.

    The starting point is POMO's CVRP solver under `pomo/`. Adapt it: the variant lives in
    the environment, and the pretrained weights under `checkpoints/` must keep loading.
  tips: |
    - The acceptance contract is textual: the program must print
      `the initial process is successful, the initial cost is <float>` and
      `the process is successful, the best cost is <float>`.
    - This instance set is MVMoE's, bit for bit, when
      `grader/data/vrpltw100_uniform.pkl` is present: 1000 instances, n = 100. Do not
      re-generate them differently, or the comparison stops meaning anything.
    - The three numbers that pin MVMoE's convention: capacity **50**, route limit **3.0**,
      service time **0.2**. A solver that invents a different capacity is solving a
      different problem.
    - The pretrained checkpoint pins the encoder's input width. New features belong in the
      decoder context, never in the encoder.
    - The training path builds its own random instances with `grader/mvmoe_gen.py`'s
      formulas. Nothing in the pipeline executes it, so exercise it directly before calling
      the work done.

problem:
  slug: "cvrpltw_n100"
  name: "Capacitated VRP with Length Limit and Time Windows (n=50, MVMoE instances)"
  kind: vrp
  variant_label: "CVRPLTW-n100-on-POMO"

  # Distinct from the other problem's `CVRPLTW` tag on purpose: the tag decides generated
  # file names and the knowledge-base file names (`cvrpltw100_skill.md`), so sharing it
  # would mix two problems' records.
  tag: "CVRPLTW100"

  checks: grader/grader.py
  agent_context: context.md

  generated:
    dir: artifacts/generated
    program: run.py
    required: [run.py]
    prefix: "{problem}"
    modules:
      - "{problem}ProblemDef.py"
      - "{problem}Env.py"
      - "{problem}Model.py"
      - "{problem}Trainer.py"
      - "{problem}Tester.py"
    entries:
      train: train_n{n}.py
      test: test_n{n}.py
    files:
      - "{problem}ProblemDef.py"
      - "{problem}Env.py"
      - "{problem}Model.py"
      - "{problem}Trainer.py"
      - "{problem}Tester.py"
      - train_n{n}.py
      - test_n{n}.py
      - run.py
      - README.md
    correspondence:
      "{problem}ProblemDef.py": "pomo/CVRProblemDef.py"
      "{problem}Env.py": "pomo/POMO/CVRPEnv.py"
      "{problem}Model.py": "pomo/POMO/CVRPModel.py"
      "{problem}Trainer.py": "pomo/POMO/CVRPTrainer.py"
      "{problem}Tester.py": "pomo/POMO/CVRPTester.py"
      "train_n{n}.py": "pomo/POMO/train_n100.py"
      "test_n{n}.py": "pomo/POMO/test_n100.py"
      "run.py": null
      "README.md": null
    # POMO's own schedule, kept as-is: the point of this bundle is the *data*, so the
    # training budget stays the one the POMO baseline uses.
    expected_params:
      trainer_params:
        epochs: 8100
        train_episodes: "10 * 1000"
        train_batch_size: 64
      tester_params:
        test_episodes: "10 * 1000"
        test_batch_size: 1000
        aug_factor: 8
      logging:
        model_save_interval: 500
        img_save_interval: 500
    dimensions:
      encoder_embedding: 128
      decoder_hidden: 128
      problem_size: "{n}"
      pomo_size: "{pomo}"
      aug_factor: "{aug}"

  cli:
    path_arg: "--path"
    iteration_arg: "--iteration"
    save_solution_arg: "--save-solution"
    extra_args: []

  program:
    best_regex: 'the process is successful, the best cost is (\d+(?:\.\d+)?)'
    initial_regex: 'the initial process is successful, the initial cost is (\d+(?:\.\d+)?)'
    expected_lines:
      - "the initial process is successful, the initial cost is {cost}"
      - "the process is successful, the best cost is {cost}"
    accepts: ["--path", "--iteration", "--save-solution"]

  # Every value below is MVMoE's, read out of `envs/VRPLTWEnv.py` (n=50 branch). Changing
  # one of them makes the instance set no longer comparable to the published results.
  data:
    dir: instances/data/cvrpltw_n100
    instance_glob: "n{n}/*.json"
    ready_marker: manifest.json
    problem_inputs:
      analysis:
        - grader
    stage_inputs:
      code_revise:
        - artifacts/analysis/analysis.json
        - artifacts/generated
        - artifacts/runs
        - artifacts/revisions
    generator: "grader:build_dataset"
    sizes: ["{n}"]
    count_per_size: 1000
    seed: 3333
    # Source of the evaluation set: `mvmoe` copies MVMoE's shipped pkl (1000 instances);
    # `generate` falls back to the same formulas when the pkl is absent.
    source: "mvmoe"
    pkl: "grader/data/vrpltw100_uniform.pkl"
    capacity: 50.0
    horizon: 3.0
    service_time: 0.2
    route_limit: 3.0

  resources:
    # Share the POMO baseline the sibling problem already ships rather than duplicating a
    # POMO lives once at the project root (`baseline/`) and every problem shares it, so
  # this bundle carries only its own notes. `pomo/` is a reference, not an answer.
    baseline_dir: "baseline"
    baseline_subdirs: [pomo, checkpoints]
    checkpoint_dir: checkpoints
    checkpoint_glob: "checkpoint*.pt"
    checkpoint: checkpoints/checkpoint-30500.pt
    notes: "seed/README.baseline.md"
    export:
      mirror_root: "."
      include: [pomo]
      exclude: [result, __pycache__]

  acceptance:
    require_solution_dump: true
    solution_key: routes
  scorer:
    kind: inverse_cost
    scale: 1.0
    direction: maximize

  mock:
    analysis: mock_analysis.json
    template: mock_solver.py

# The task's own scale. Without it the engine falls back to n=20, which would silently
# produce n20 instances under a bundle whose whole point is n=50.
scale:
  problem_size: 100
  pomo_size: 100
  aug_factor: 8

stages: default

llm:
  backend: "dsh"
  runtime: "dsh"
  dsh_bin: "dsh"
  # dsh_home is deliberately NOT set: leaving DSH_HOME unset lets DSH use its real home,
  # which is where the DeepSeek credential lives (`<home>/llm-deepseek/`). Setting it to a
  # per-run `.dsh` isolates the run's session state but hides that store, and every turn
  # then fails with `MISSING_CREDENTIAL` unless DEEPSEEK_API_KEY is exported.
  inherit_routing_env: true      # 让 DEEPSEEK_API_KEY 被继承
  timeout_seconds: 3600
  runtime_options:
    profile: "headless"
    permission_mode: "workspace-write"
    tools_mode: "native"
    patch: []                    # 要换模型就写 patch 文件的路径
  # 注意：model 字段保留但不生效——dsh 没有 --model flag


workspace:
  results_dir: "./results"
  final_dir: "./workspace/final"
  setup:
      - ["uv pip install torch --index-url https://download.pytorch.org/whl/cu126",
         "uv pip install torch --index-url https://download.pytorch.org/whl/cpu"]

grader:
  iterations: 1000
  instance_size: 100
  require_solution_dump: true

run:
  verbose: false
  ui: false
  session: "local"
