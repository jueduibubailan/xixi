task:
  name: VRPLTW-n50 (MVMoE)
  slug: cvrpltw_n50
  description: "VRPLTW -- Vehicle Routing Problem with Length limits and Time Windows\
    \ -- is MVMoE's\nvariant of CVRP: a capacitated routing problem with, on top of\
    \ capacity, a limit on the\nduration of every route and a time window at every\
    \ customer. This instance set is at\nn = 50 customers.\n\n## Instance\n\nA single\
    \ depot and n customers are placed uniformly at random in the unit square. Every\n\
    customer has an integer demand, a time window, and a service time. A vehicle travels\
    \ at\nspeed 1, so one unit of distance takes one unit of time and the entire schedule\
    \ lives on\nthe clock [0, 3].\n\n  depot position        uniform in [0, 1] x [0,\
    \ 1]\n  customer positions    uniform in [0, 1] x [0, 1], n = 50 of them\n  demand\
    \                integer, uniform in {1, ..., 9}\n  capacity              40 for\
    \ n = 50\n  service time          0.2 at every customer\n  time window       \
    \    [start, end] per customer, inside [0, 3]\n  route length limit    3.0\n \
    \ horizon               3.0, the time at which the depot closes\n\nDemand is stored\
    \ raw (1..9) together with the capacity; a network typically sees\ndemand / capacity.\n\
    \n## Time windows\n\nWindows follow the construction used by \"Learning to Delegate\
    \ for Large-scale Vehicle\nRouting\" (NeurIPS 2021), which MVMoE adopts: with\
    \ t = distance from the depot to the\ncustomer,\n\n  a = t\n  b = 3 - t - 0.2\n\
    \  center     = (a - b) * u + b              for u uniform in [0, 1]\n  half_width\
    \ = (0.2/2 - 3/3) * v + 3/3      for v uniform in [0, 1]   (0.1 .. 1.0)\n  start\
    \ = clamp(center - half_width, 0, 3)\n  end   = clamp(center + half_width, 0,\
    \ 3)\n\nA draw is discarded, and the sample regenerated, when serving that customer\
    \ and\nreturning to the depot cannot fit in the horizon:\n\n  max(t, start) +\
    \ 0.2 + t > 3\n\n## Feasible route\n\nA route is an ordered sequence of customers,\
    \ starting and ending at the depot. It is\nfeasible when all of the following\
    \ hold:\n\n  1. each customer is visited exactly once across all routes;\n  2.\
    \ the total demand served on the route is at most the vehicle capacity (40);\n\
    \  3. the total Euclidean length of the route, including both depot legs, is at\
    \ most the\n     route length limit (3.0);\n  4. at every customer the service\
    \ can start no later than its due time: if the vehicle\n     arrives before the\
    \ ready time it waits, and service starts at max(arrival, ready);\n     the requirement\
    \ is max(arrival, ready) <= due;\n  5. after the last customer, the vehicle can\
    \ still reach the depot before the horizon:\n     max(arrival, ready) + service\
    \ time + distance to the depot <= 3.0.\n\nBecause waiting is allowed but consumes\
    \ time without adding distance, constraint 3 and\nconstraint 5 are not equivalent:\
    \ a route can be short and still late, or long and still\nearly. Returning to\
    \ the depot is always permitted, so a vehicle may always start a new\nroute.\n\
    \n## Objective\n\nMinimise the total travel distance over all routes. Distance\
    \ is the only cost: there is\nno penalty term, no makespan term and no charge\
    \ for using more vehicles, so a solution\nmay open as many routes as it likes\
    \ provided each one is feasible.\n\n## Solution\n\nA solution is a set of routes,\
    \ each a sequence of customer indices (the depot is\nimplicit at both ends), together\
    \ with the total distance.\n"
  tips: '- The final score is the last AUGMENTATION SCORE line printed by test_n.

    - test_n uses random test data (test_data_load.enable = False).

    - Do not generate run.py; test_train.py is generated by the code_error agent.'
