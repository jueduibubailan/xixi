task:
  name: CVRPTW-on-POMO
  slug: cvrptw
  description: "Solve the Capacitated Vehicle Routing Problem with Time Windows (CVRPTW)\
    \ using\nPOMO as the starting point.\n\nA depot and n customers are given. Every\
    \ customer has a demand and a time window\n[ready, due], and every customer takes\
    \ a service time to serve.\n\nWrite a program that finds a set of routes minimising\
    \ the total travel distance\nsuch that:\n  1. every customer is served exactly\
    \ once across all routes;\n  2. the total demand served on a route never exceeds\
    \ the vehicle capacity;\n  3. the arrival time at a customer is <= its due time.\
    \ Arriving before the ready\n     time is legal: the vehicle waits, and service\
    \ starts at max(arrival, ready);\n  4. every route starts and ends at the depot,\
    \ and returning to the depot is always\n     allowed, because it is what makes\
    \ a state with no legal customer escapable.\n\nTravel time is the Euclidean distance\
    \ between nodes (a vehicle speed of 1), so\n\"arrival\" and \"distance\" are the\
    \ same quantity up to the clock carried along a route.\n\nThe starting point is\
    \ POMO's CVRP solver under `pomo/`. Adapt it: the variant lives\nin the environment\
    \ (an extra state and the masks that enforce the constraints), and\nthe code must\
    \ train from scratch and write its own checkpoint.\n"
  tips: '- The final score is the last AUGMENTATION SCORE line printed by test_n.

    - test_n uses random test data (test_data_load.enable = False).

    - Do not generate run.py; test_train.py is generated by the code_error agent.'
