# This file is a problem bundle: the problem statement, the pipeline that solves it, and
# where its seed and grader live. It is also runnable --
# `vrpar start problems/cvrptw/task.yaml` runs this problem against itself. A task with
# different settings points here instead:
#
#     problem:
#       dir: problems/cvrptw

task:
  name: "CVRPTW-on-POMO"
  slug: "cvrptw"
  description: |
    Solve the Capacitated Vehicle Routing Problem with Time Windows (CVRPTW) using
    POMO as the starting point.

    A depot and n customers are given. Every customer has a demand and a time window
    [ready, due], and every customer takes a service time to serve.

    Write a program that finds a set of routes minimising the total travel distance
    such that:
      1. every customer is served exactly once across all routes;
      2. the total demand served on a route never exceeds the vehicle capacity;
      3. the arrival time at a customer is <= its due time. Arriving before the ready
         time is legal: the vehicle waits, and service starts at max(arrival, ready);
      4. every route starts and ends at the depot, and returning to the depot is always
         allowed, because it is what makes a state with no legal customer escapable.

    Travel time is the Euclidean distance between nodes (a vehicle speed of 1), so
    "arrival" and "distance" are the same quantity up to the clock carried along a route.

    The starting point is POMO's CVRP solver under `pomo/`. Adapt it: the variant lives
    in the environment (an extra state and the masks that enforce the constraints), and
    the pretrained weights under `checkpoints/` must keep loading.
  tips: |
    - The acceptance contract is textual: the program must print
      `the initial process is successful, the initial cost is <float>` and
      `the process is successful, the best cost is <float>`.
    - The pretrained checkpoint pins the encoder's input width. New features belong in
      the decoder context, never in the encoder.
    - `checkpoints/` is a drop box: a user puts the weights they trained there, and
      the test entry point resolves them at run time instead of naming a file.
    - Evaluation instances are generated by `grader/cvrptw_gen.py` before any agent runs;
      they are read-only, so the solver has to handle them rather than the other way round.
    - The training path builds its own random instances. Nothing in the pipeline executes
      it, so exercise it directly before calling the work done.

problem:
  slug: "cvrptw"
  name: "Capacitated VRP with Time Windows"
  kind: vrp
  variant_label: "CVRPTW-on-POMO"
  # The identifier generated files are named after: `{problem}Env.py` -> `CVRPTWEnv.py`.
  tag: "CVRPTW"

  # The checker, the scorer and the instance generator, all in one module inside the
  # bundle. Its directory is on `sys.path` while it loads, so it can import the generator
  # file next to it.
  checks: grader/grader.py

  # Extra "Available inputs" text injected into every stage instruction.
  agent_context: context.md

  # What the generated package looks like. Every file adapted from the seed baseline is
  # named `{problem}{Role}.py` and carries a `# baseline-correspondence: <seed path>`
  # first line, which is what makes "one-to-one with the baseline" and "no extra generated
  # code" checkable without a human.
  generated:
    dir: artifacts/generated
    program: run.py
    required: [run.py]
    prefix: "{problem}"
    modules:
      - "{problem}ProblemDef.py"
      - "{problem}Env.py"
      - "{problem}Model.py"
      - "{problem}Trainer.py"
      - "{problem}Tester.py"
    entries:
      train: train_n{n}.py
      test: test_n{n}.py
    files:
      - "{problem}ProblemDef.py"
      - "{problem}Env.py"
      - "{problem}Model.py"
      - "{problem}Trainer.py"
      - "{problem}Tester.py"
      - train_n{n}.py
      - test_n{n}.py
      - run.py
      - README.md
    correspondence:
      "{problem}ProblemDef.py": "pomo/CVRProblemDef.py"
      "{problem}Env.py": "pomo/POMO/CVRPEnv.py"
      "{problem}Model.py": "pomo/POMO/CVRPModel.py"
      "{problem}Trainer.py": "pomo/POMO/CVRPTrainer.py"
      "{problem}Tester.py": "pomo/POMO/CVRPTester.py"
      "train_n{n}.py": "pomo/POMO/train_n100.py"
      "test_n{n}.py": "pomo/POMO/test_n100.py"
      "run.py": null
      "README.md": null
    # The parameter values the baseline uses. The correspondence gate fails when the
    # generated entry points tune these down instead of keeping them.
    expected_params:
      trainer_params:
        epochs: 8100
        train_episodes: "10 * 1000"
        train_batch_size: 64
      tester_params:
        test_episodes: "10 * 1000"
        test_batch_size: 1000
        aug_factor: 8
      logging:
        model_save_interval: 500
        img_save_interval: 500
    dimensions:
      encoder_embedding: 128
      decoder_hidden: 128
      problem_size: "{n}"
      pomo_size: "{pomo}"
      aug_factor: "{aug}"

  # How to invoke the generated program. `null` means "this variant's program does not
  # take that flag".
  cli:
    path_arg: "--path"
    iteration_arg: "--iteration"
    save_solution_arg: "--save-solution"
    extra_args: []

  # What the program must print for the exit gate to score it.
  program:
    best_regex: 'the process is successful, the best cost is (\d+(?:\.\d+)?)'
    initial_regex: 'the initial process is successful, the initial cost is (\d+(?:\.\d+)?)'
    expected_lines:
      - "the initial process is successful, the initial cost is {cost}"
      - "the process is successful, the best cost is {cost}"
    accepts: ["--path", "--iteration", "--save-solution"]

  # Where the run data comes from. `generator` is a module:function resolved inside the
  # bundle's `grader/`, and it is what `vrpar` calls to build the evaluation instances.
  data:
    dir: instances/data/cvrptw
    instance_glob: "n{n}/*.json"
    ready_marker: manifest.json
    problem_inputs:
      analysis:
        - grader
    stage_inputs:
      code_revise:
        - artifacts/analysis/analysis.json
        - artifacts/generated
        - artifacts/runs
        - artifacts/revisions
    generator: "grader:build_dataset"
    sizes: ["{n}"]
    count_per_size: 3
    seed: 1234
    capacity: 30.0
    service_time: 0.05
    # `horizon: null` derives the depot horizon from a canonical feasible schedule. A
    # fixed value that is too small raises instead of emitting an infeasible instance.
    horizon: null
    window_width_choices: [0.2, 0.4, 0.6]
    # Larger instances need slack, or the "canonical schedule -> windows" construction has
    # nothing to work with: the generator widens the windows and retries rather than
    # raising. Tuned so n=100 stays feasible on CPU-sized seeds.
    slack:
      small_width: 0.6
      large_width: 1.2
      retries: 8

  # The reference implementation the agents modify, staged into every worktree. POMO is
  # shared by every problem and lives at the project root (`baseline/`), so it is not
  # copied into the bundle: its contents land at the worktree root as `pomo/` and
  # `checkpoints/`, which is the layout the correspondence table below addresses
  # (`pomo/CVRProblemDef.py` and friends). `seed/` holds only this problem's notes.
  resources:
    baseline_dir: "baseline"
    baseline_subdirs: [pomo, checkpoints]
    checkpoint_dir: checkpoints
    checkpoint_glob: "checkpoint*.pt"
    checkpoint: checkpoints/checkpoint-30500.pt
    notes: seed/README.baseline.md
    export:
      mirror_root: "."
      include: [pomo]
      exclude: [result, __pycache__]

  acceptance:
    require_solution_dump: true
    solution_key: routes
  scorer:
    kind: inverse_cost      # score = scale / best_cost
    scale: 1.0
    direction: maximize

  # Offline (no-model) backend behaviour. `analysis` is a real analysis payload for this
  # variant and `template` is a genuinely runnable first-cut solver, so a
  # `llm.backend=mock` run exercises the contract and the checker for real.
  mock:
    analysis: mock_analysis.json
    template: mock_solver.py

# The seven stages, the loop and the budgets come from the engine: `stages: default`
# expands to `vrpar.pipeline.spec.STAGES`.
stages: default

llm:
  backend: "claude_code"      # claude_code | coral | dsh | mock
  runtime: "claude_code"      # CORAL-style runtime name (kept for shell parity)
  model: "deepseek-flash"     # model id passed to the runtime CLI
  claude_bin: "claude"        # resolved via PATH; set an absolute path if needed
  max_turns: 0                # 0 = let the session run until it exits naturally
  permission_mode: "auto"     # passed as --permission-mode / DSH_PERMISSION_MODE
  extra_args: []              # extra CLI flags appended verbatim
  inherit_routing_env: true
  env: {}
  timeout_seconds: 3600       # per-stage wall clock before we kill the agent


workspace:
  results_dir: "./results"
  final_dir: "./workspace/final"
  setup:
      - ["uv pip install torch --index-url https://download.pytorch.org/whl/cu126",
         "uv pip install torch --index-url https://download.pytorch.org/whl/cpu"]

grader:
  iterations: 1000
  instance_size: 100
  require_solution_dump: true

run:
  verbose: false
  ui: false
  session: "local"
