task:
  name: OVRPBTW-n100 (MVMoE)
  slug: mvmoe_ovrpbtw_n100
  description: 'OVRPBTW at n = 100 customers, as MVMoE defines it: open routes, backhaul
    customers and time windows.


    Instance: one depot and 100 customers uniform in the unit square; a demand in
    1..9 per

    customer; capacity 50; service time 0.2; time windows inside [0, 3] when the problem

    has them; route length limit 3.0 when the problem has it; vehicle speed 1.


    Objective: minimise the total travel distance over all routes (for open routes,
    the

    distance up to the last customer, since there is no return leg).


    A solution is a list of routes, each a sequence of customer indices 1..100 with
    the depot

    implicit at the ends (only the start, for open routes), together with the total
    distance.

    '
  tips: '- The final score is the last AUGMENTATION SCORE line printed by test_n.

    - test_n uses random test data (test_data_load.enable = False).

    - Do not generate run.py; test_train.py is generated by the code_error agent.'
