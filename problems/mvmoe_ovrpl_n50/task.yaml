task:
  name: "OVRPL-n50 (MVMoE)"

  slug: "mvmoe_ovrpl_n50"

  description: |
    Solve the Open Vehicle Routing Problem with a Length limit (OVRPL) by
    adapting POMO's CVRP solver. This is MVMoE's OVRPL variant at n = 50.

    A depot and 50 customers are given. The depot is index 0; customers are
    indices 1..50. A route starts at the depot, visits a sequence of customers,
    and ends at its last customer. It does **not** return to the depot.

    Every route must satisfy ALL of the following:

    1. Every customer is served exactly once across all routes.
    2. The sum of demands on a route is <= `capacity`.
    3. The open-route length is <= `route_limit`. The length is the sum of
       Euclidean leg lengths from the depot through the customers; there is no
       return leg.

    The objective is to minimise the total open-route distance over all routes.
    There are no time windows and no service times in OVRPL. Travel cost is pure
    Euclidean distance; vehicle speed is irrelevant.

    OVRPL is the open-route variant with a length limit:
      - "open" means the route ends at the last customer; the leg back to the
        depot is neither required nor counted in the objective;
      - the environment may select the depot to close a route and start another
        one, but that closing leg is not part of the cost;
      - selecting the depot is always legal; it is the escape action when no
        customer can be served next.

    The length mask is:

        current_length + dist(current_node, j) > route_limit  =>  j is illegal

    with the depot (index 0) always exempt. `current_length` resets to 0 when a
    new route starts at the depot. `capacity` is 40 for n = 50; demands are
    integers 1..9. MVMoE normalises demand by capacity, so a normalized
    environment uses `demand / 40` and capacity 1.0.

    Instance generation follows MVMoE's `OVRPLEnv.get_random_problems`:

      - `depot_xy`: uniform in [0, 1), shape (batch, 1, 2);
      - `node_xy`: uniform in [0, 1), shape (batch, 50, 2);
      - demand scaler for n = 50: 40;
      - `node_demand`: integers 1..9 (unnormalised), or `randint(1, 10) / 40`
        when normalised;
      - `capacity`: 40.0 (or 1.0 normalised);
      - `route_limit`: 3.0 for every n = 50 instance;
      - no time windows and no service times.

    The evaluation set is MVMoE's shipped
    `grader/data/ovrpl50_uniform.pkl`: 1000 records of
    `(depot_xy, node_xy, node_demand, capacity, route_limit)`. If the set is
    regenerated, use MVMoE's `generate_data.py --problem OVRPL
    --problem_size 50 --num_samples 1000` (default seed 2025); the shipped pkl
    is the authoritative evaluation set.

    Adapt POMO's five baseline files. Do not replace the encoder/decoder family,
    do not add pretrained weights, and start training from scratch.

  tips: |
    - The final score is the last `AUGMENTATION SCORE:` line printed by the final
      test entry `test_<n>.py` (for example `test_50.py`).
    - The test entry uses random test data: `test_data_load.enable = False`,
      `test_episodes = 10*1000`.
    - It loads the checkpoint produced by `test_train.py` via `--model-path`.
    - Do not generate `run.py`; `test_train.py` is generated by the code_error
      agent.
    - `test_train.py` must set `epochs: 1` and `train_episodes: 64`.
