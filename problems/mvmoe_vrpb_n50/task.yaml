task:
  name: VRPB-n50 (MVMoE)
  slug: mvmoe_vrpb_n50
  description: 'VRPB at n = 50 customers, as MVMoE defines it: a capacitated routing
    problem with backhauls: linehaul customers are served first, then backhaul customers,
    and the load changes direction between the two groups.


    Instance: one depot and 50 customers uniform in the unit square; a demand in 1..9
    per

    customer; capacity 40; route length limit 3.0; service time 0.2; time windows
    inside

    [0, 3] when the problem has them; vehicle speed 1, so distance and time are interchangeable.


    Objective: minimise the total travel distance over all routes (for open routes,
    the

    distance up to the last customer, since there is no return leg).


    A solution is a list of routes, each a sequence of customer indices 1..50 with
    the depot

    implicit at the ends (only the start, for open routes), together with the total
    distance.

    '
  tips: '- The final score is the last AUGMENTATION SCORE line printed by test_n.

    - test_n uses random test data (test_data_load.enable = False).

    - Do not generate run.py; test_train.py is generated by the code_error agent.'
