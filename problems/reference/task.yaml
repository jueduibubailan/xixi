task:
  name: "CVRPLTW-on-POMO"

  # 必须与目录名一致，或至少与运行/导出目录一致。
  # 这个字段决定 run 目录名和 workspace/final/<slug>/。
  slug: "cvrpltw_reference"

  description: |
    Solve the Capacitated Vehicle Routing Problem with **Length Limit** and
    Time Windows (CVRPLTW) by adapting POMO's CVRP solver.

    A depot and n customers are given. Every customer has:
      - a demand;
      - a time window [ready, due];
      - a service time.

    Travel time equals the Euclidean distance between nodes (vehicle speed = 1).
    Arriving before `ready` is legal: the vehicle waits, and service starts at
    `max(arrival, ready) + service_time`. Arriving after `due` is infeasible.
    Returning to the depot is always allowed; it is what makes a state with no
    legal customer escapable.

    A solution is a set of routes. Each route is a sequence of customer indices
    1..n; the depot (index 0) is implicit at both ends. The objective is to
    minimise the total travel distance over all routes.

    Every route must satisfy ALL of the following:

    1. Every customer is served exactly once across all routes.
    2. The sum of demands on a route is <= `capacity`.
    3. The arrival time at every customer is <= its `due` time.
    4. The route's own length, i.e. the sum of Euclidean leg lengths including
       the depot legs, is <= `max_route_length` (a per-instance value).
    5. Every route starts and ends at the depot.

    CVRPLTW is CVRPTW plus constraint 4. Capacity and every time window can be
    satisfied while a route is still rejected for running too long, so the
    environment needs a fifth mask (or an equivalent length-aware decision) and
    a way to return to the depot before the limit is exceeded.

    Instance fields (JSON):
      - `problem_size`: n customers (the depot is index 0);
      - `capacity`: vehicle capacity;
      - `horizon`: depot time-window upper bound;
      - `depot_xy`: [[x, y]];
      - `node_xy`: [[x, y], ...] for n customers;
      - `node_demand`: [d1, ..., dn];
      - `time_windows`: [[ready, due], ...] for the depot and n customers;
      - `service_times`: [s0, ..., sn] (depot service time is 0);
      - `max_route_length`: per-instance route length limit.

    Adapt POMO's five baseline files. Do not replace the encoder/decoder family,
    do not add pretrained weights, and start training from scratch.

  tips: |
    - The final score is the last `AUGMENTATION SCORE:` line printed by `test_n`.
    - `test_n` uses random test data: `test_data_load.enable = False`,
      `test_episodes = 10*1000`.
    - `test_n` loads the checkpoint produced by `test_train.py` via `--model-path`.
    - Do not generate `run.py`; `test_train.py` is generated by the code_error agent.
    - `test_train.py` must set `epochs: 1` and `train_episodes: 64`.
