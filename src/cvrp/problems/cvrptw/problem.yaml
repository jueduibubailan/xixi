# CVRPTW problem spec.
#
# Read by `cvrp.problems.load_problem`. This file is the *only* place a VRP
# variant is described: change it (plus the prompts and checks.py next to it) and
# the engine will synthesize a solver for a different variant without any change
# under src/cvrp/{pipeline,executor,web}.

slug: cvrptw
name: "Capacitated VRP with Time Windows"
kind: vrp
variant_label: "CVRPTW-on-POMO"
# The identifier generated files are named after: `{problem}Env.py` -> `CVRPTWEnv.py`.
tag: "CVRPTW"

# `task.yaml:problem.dir` overrides this location; by default the engine looks for
# a directory carrying a problem.yaml, first in <project>/problems/<slug>/ and then
# inside the installed package.
checks: checks.py

prompts:
  analysis: prompts/s1_analysis.md
  analysis_judge: prompts/s1_analysis_judge.md
  codegen: prompts/s2_codegen.md
  codegen_judge: prompts/s2_codegen_judge.md
  # The revise stage runs three turns: read the code, attribute the failure, repair.
  code_review: prompts/s4_code_review.md
  error_analyse: prompts/s4_error_analyse.md
  revise: prompts/s4_revise.md

# Extra "Available inputs" text injected into every generated CVPR.md.
agent_context: problem_context.md

# What the generated package looks like.
#
# Naming rule: every file adapted from POMO is named `{problem}{Role}.py`, and
# carries a `# baseline-correspondence: <pomo path>` first line that the executor's
# correspondence gate verifies. That is how "one-to-one with POMO" (renaming is
# expected) and "no extra generated code" are both checkable without a human.
generated:
  dir: artifacts/generated
  program: run.py
  required: [run.py]
  prefix: "{problem}"
  modules:
    - "{problem}ProblemDef.py"
    - "{problem}Env.py"
    - "{problem}Model.py"
    - "{problem}Trainer.py"
    - "{problem}Tester.py"
  entries:
    # `{n}` is the task's problem size (task.yaml:scale.problem_size).
    train: train_n{n}.py
    test: test_n{n}.py
  files:
    - "{problem}ProblemDef.py"
    - "{problem}Env.py"
    - "{problem}Model.py"
    - "{problem}Trainer.py"
    - "{problem}Tester.py"
    - train_n{n}.py
    - test_n{n}.py
    - run.py
    - README.md
  # The authoritative one-to-one map. `null` marks a deliverable with no POMO
  # source (so it must NOT carry a correspondence line). The correspondence gate
  # fails when a declared deliverable is missing, when a `pomo/` source named here
  # does not exist, or when a deliverable's declared first-line correspondence
  # points somewhere other than its entry here.
  correspondence:
    "{problem}ProblemDef.py": "pomo/CVRProblemDef.py"
    "{problem}Env.py": "pomo/POMO/CVRPEnv.py"
    "{problem}Model.py": "pomo/POMO/CVRPModel.py"
    "{problem}Trainer.py": "pomo/POMO/CVRPTrainer.py"
    "{problem}Tester.py": "pomo/POMO/CVRPTester.py"
    "train_n{n}.py": "pomo/POMO/train_n100.py"
    "test_n{n}.py": "pomo/POMO/test_n100.py"
    "run.py": null
    "README.md": null
  # Dimensions the code generation prompt quotes. Documentation for the agent, not
  # something the engine enforces -- except that the embedding widths must stay
  # compatible with the pretrained checkpoint.
  dimensions:
    encoder_embedding: 128
    decoder_hidden: 128
    problem_size: "{n}"
    pomo_size: "{pomo}"
    aug_factor: "{aug}"

# How to invoke the generated program. `null` means "this variant's program does
# not take that flag".
cli:
  path_arg: "--path"
  iteration_arg: "--iteration"
  save_solution_arg: "--save-solution"
  extra_args: []

# What the program must print for the exit gate to score it. These are inherited
# from AFL's textual contract; a variant may override either regex.
program:
  best_regex: 'the process is successful, the best cost is (\d+(?:\.\d+)?)'
  initial_regex: 'the initial process is successful, the initial cost is (\d+(?:\.\d+)?)'
  expected_lines:
    - "the initial process is successful, the initial cost is {cost}"
    - "the process is successful, the best cost is {cost}"
  accepts: ["--path", "--iteration", "--save-solution"]

# Where the run data comes from. `build_dataset` is implemented in checks.py and
# delegates to instances.py.
data:
  dir: instances/data/cvrptw
  instance_glob: "n{n}/*.json"
  ready_marker: manifest.json
  # Per-stage read-only inputs staged under `data/`. Stages already see every
  # earlier stage's declared output; this adds extras (or narrows them).
  stage_inputs:
    code_revise:
      - artifacts/analysis/analysis.json
      - artifacts/generated
      - artifacts/runs
      - artifacts/revisions
  generator: instances.py:build_dataset
  # `sizes` is what the generator loops over. It defaults to the task's
  # problem_size, so `scale.problem_size: 50` generates n50 instances without the
  # task file repeating the number.
  sizes: ["{n}"]
  count_per_size: 3
  seed: 1234
  capacity: 30.0
  service_time: 0.05
  # `horizon: null` derives the depot horizon from a canonical feasible schedule.
  # A fixed value that is too small raises instead of emitting an infeasible
  # instance -- see instances.py.
  horizon: null
  window_width_choices: [0.2, 0.4, 0.6]
  # Larger instances need slack, or the "canonical schedule -> windows" construction
  # has nothing to work with: the generator widens the windows and retries rather
  # than raising. Tuned emprically so n=100 stays feasible on CPU-sized seeds.
  slack:
    small_width: 0.6
    large_width: 1.2
    retries: 8

# The reference implementation the agents modify, staged into every worktree.
# `baseline_dir` is resolved against the project root first and the problem
# directory second, so a problem can either ship its payload next to its spec (as
# this one does) or point at a shared location such as `./baseline`.
resources:
  baseline_dir: src/cvrp/problems/cvrptw
  baseline_subdirs: [pomo, checkpoints]
  # `checkpoints/` is a *drop box*, not a shipped artifact: it starts empty and the
  # user puts the weights they trained there. `test_n{n}.py` reads it (see
  # `checkpoint_glob`) instead of a hardcoded filename, so shipping or renaming a
  # checkpoint never requires editing generated code.
  checkpoint_dir: checkpoints
  checkpoint_glob: "checkpoint*.pt"
  # Kept for documentation and for any tooling that wants "the reference weight".
  # Nothing in the deliverable may depend on this exact filename.
  checkpoint: checkpoints/checkpoint-30500.pt
  notes: BASELINE_NOTES.md
  # What the *export* carries besides the generated files.
  #
  # The generated code imports POMO's toolchain (`from pomo.POMO.utils.utils
  # import ...`, `from pomo.CVRProblemDef import ...`) and its own modules by bare
  # name, which only resolves when the directory holding `pomo/` is the working
  # directory root. So the export mirrors that layout instead of flattening it, and
  # ships `pomo/` alongside: a user who receives `workspace/final/<slug>/` can train
  # and evaluate without hunting for the environment.
  #
  # `checkpoints/` is deliberately NOT here: it is the user's drop box for weights
  # they produced by training, so the export leaves it out rather than filling it
  # with a reference weight nobody asked for.
  export:
    mirror_root: "."
    include: [pomo]
    exclude: [result, __pycache__]

# Acceptance + scoring.
acceptance:
  require_solution_dump: true
  solution_key: routes
scorer:
  kind: inverse_cost      # score = scale / best_cost
  scale: 1.0
  direction: maximize

# Offline (no-model) backend behaviour. `analysis` is a real analysis payload for
# this variant, and `template` is a genuinely runnable first-cut solver, so a
# `llm.backend=mock` run exercises the contract and the checks for real.
mock:
  analysis: mock_analysis.json
  template: mock_solver.py
