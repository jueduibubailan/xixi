# CVRPTW at n=20, written as a small task that points at the problem bundle.
#
# The problem itself -- its statement, its checker, its baseline -- lives in
# problems/cvrptw/. This file only says which size to run and how.
#
#   uv run vrpar start task.yaml
#   uv run vrpar start task.yaml llm.backend=mock     # offline self-check
task:
  name: "CVRPTW-n20-on-POMO"
  slug: "cvrptw-n20"
  description: |
    Solve CVRPTW at n = 20: minimise total travel distance with a capacity limit, time
    windows, service times and unit travel speed. See problems/cvrptw/task.yaml for the
    full statement; this task runs it at 20 customers.
  tips: |
    Smallest instance size: the fastest way to see the pipeline work end to end.

problem:
  dir: "problems/cvrptw"

scale:
  problem_size: 20          # customers (the instance DIMENSION is this + 1)
  pomo_size: 20             # parallel rollouts; omit to default to problem_size
  aug_factor: 8             # POMO's 8-fold symmetry augmentation

stages: default

llm:
  backend: "claude_code"    # claude_code | coral | dsh | mock
  model: "deepseek-flash"
  inherit_routing_env: true
  timeout_seconds: 3600

workspace:
  results_dir: "./results"
  final_dir: "./workspace/final"
  setup:
    - ["uv pip install torch --index-url https://download.pytorch.org/whl/cu126",
       "uv pip install torch --index-url https://download.pytorch.org/whl/cpu"]

grader:
  iterations: 1000
  instance_size: 20
  require_solution_dump: true

run:
  verbose: false
  ui: false
  session: "local"
