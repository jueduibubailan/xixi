# CVRPTW at n=100: a thin task over the problem bundle in problems/cvrptw/.
#
#   uv run cvrp start task_n100.yaml
#   uv run cvrp start task_n100.yaml llm.backend=mock     # offline self-check
task:
  name: "CVRPTW-n100-on-POMO"
  slug: "cvrptw-n100"
  description: |
    Solve CVRPTW at n = 100: minimise total travel distance with a capacity limit, time
    windows, service times and unit travel speed. The problem statement, checker, baseline
    and prompts live in problems/cvrptw/; this file sets the size.
  tips: |
    n = 100 customers, so every instance array is 101 long (index 0 is the depot).

problem:
  dir: "problems/cvrptw"

scale:
  problem_size: 100          # customers (the instance DIMENSION is this + 1)
  pomo_size: 100             # parallel rollouts; omit to default to problem_size
  aug_factor: 8             # POMO's 8-fold symmetry augmentation

stages: default

llm:
  backend: "claude_code"    # claude_code | coral | dsh | mock
  model: "deepseek-flash"
  inherit_routing_env: true
  timeout_seconds: 3600

workspace:
  results_dir: "./results"
  final_dir: "./workspace/final"

grader:
  iterations: 1000
  instance_size: 100
  require_solution_dump: true

run:
  verbose: false
  ui: false
  session: "local"
